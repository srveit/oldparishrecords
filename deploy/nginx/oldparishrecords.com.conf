# oldparishrecords.com vhost for the sites VM.
# OPNsense terminates TLS and proxies the whole host here.
# This file owns path routing. Do not duplicate /dashboard-old/ on OPNsense.
#
# Install:
#   sudo cp deploy/nginx/opr-dashboard-http.conf /etc/nginx/conf.d/opr-dashboard-http.conf
#   sudo cp deploy/nginx/oldparishrecords.com.conf /etc/nginx/sites-available/oldparishrecords.com
#   sudo nginx -t && sudo systemctl reload nginx

upstream opr_lank_search {
    server 127.0.0.1:8000;
    keepalive 8;
}

# Current dashboard, still on grokbot-box. Prefix is stripped.
upstream opr_dashboard_old {
    server 100.120.170.46:80;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name oldparishrecords.com www.oldparishrecords.com;

    client_max_body_size 16M;

    # Bare prefix redirects. More specific than the prefixed locations below.
    location = /dashboard-old {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        return 301 https://$host/dashboard-old/;
    }

    location = /dashboard {
        return 301 https://$host/dashboard/;
    }

    # No URI on proxy_pass: /dashboard/login stays /dashboard/login on lank-search.
    location = /dashboard/login {
        proxy_pass http://opr_lank_search;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $opr_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /dashboard;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /dashboard/logout {
        proxy_pass http://opr_lank_search;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $opr_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /dashboard;
        proxy_set_header Connection "";
    }

    location /dashboard/ {
        proxy_pass http://opr_lank_search;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $opr_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /dashboard;
        proxy_set_header Connection "";
    }

    location = /dashboard-old/login {
        limit_req zone=opr_dash_login burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;

        proxy_pass http://opr_dashboard_old/login;
        proxy_http_version 1.1;
        proxy_set_header Host grokbot-box.taileabb91.ts.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $opr_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /dashboard-old;
        proxy_set_header Authorization "";
	proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";

        proxy_redirect /dashboard/ /dashboard-old/;
        proxy_redirect https://oldparishrecords.com/dashboard/ https://oldparishrecords.com/dashboard-old/;
        proxy_cookie_path /dashboard/ /dashboard-old/;

        sub_filter 'value="/dashboard/"' 'value="/dashboard-old/"';
        sub_filter_once on;

        proxy_cache off;
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Robots-Tag;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /dashboard-old/logout {
        proxy_pass http://opr_dashboard_old/logout;
        proxy_http_version 1.1;
        proxy_set_header Host grokbot-box.taileabb91.ts.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $opr_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /dashboard-old;
        proxy_set_header Authorization "";
	proxy_set_header Connection "";

        proxy_redirect /dashboard/ /dashboard-old/;
        proxy_redirect https://oldparishrecords.com/dashboard/ https://oldparishrecords.com/dashboard-old/;
        proxy_cookie_path /dashboard/ /dashboard-old/;

        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Robots-Tag;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /_opr_dash_auth {
        internal;
        proxy_pass http://opr_dashboard_old/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host grokbot-box.taileabb91.ts.net;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Original-URI $request_uri;
	proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location @opr_dash_login {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        if ($opr_dash_want_json) {
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            return 401 '{"error":"login required"}';
        }
        return 302 /dashboard-old/login?next=$request_uri;
    }

    location /dashboard-old/ {
        auth_request /_opr_dash_auth;
        error_page 401 = @opr_dash_login;

        proxy_pass http://opr_dashboard_old/;
        proxy_http_version 1.1;
        proxy_set_header Host grokbot-box.taileabb91.ts.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $opr_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /dashboard-old;
        proxy_set_header Authorization "";
	proxy_set_header Connection "";

        proxy_redirect /dashboard/ /dashboard-old/;
        proxy_redirect https://oldparishrecords.com/dashboard/ https://oldparishrecords.com/dashboard-old/;
        proxy_cookie_path /dashboard/ /dashboard-old/;

        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Public search. /dashboard/ is matched above and also goes to lank-search.
    location / {
        proxy_pass http://opr_lank_search;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $opr_forwarded_proto;
    }
}

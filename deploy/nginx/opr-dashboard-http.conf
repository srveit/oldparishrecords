# Included from the http block, not from the server block.
# Maps and limit_req_zone are illegal inside server {}.
# Install: copy to /etc/nginx/conf.d/opr-dashboard-http.conf

map $request_method $opr_dash_login_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $opr_dash_login_key zone=opr_dash_login:1m rate=10r/m;

map $request_method $opr_dash_nonget {
    default 1;
    GET     0;
}
map $http_accept $opr_dash_html {
    default       0;
    "~*text/html" 1;
}
map $uri $opr_dash_apiish {
    default                 0;
    "~^/dashboard-old/api/" 1;
    "~^/dashboard/api/"     1;
    "~\.(json|js)$"         1;
}
map "$opr_dash_nonget$opr_dash_html$opr_dash_apiish" $opr_dash_want_json {
    default 1;
    "010"   0;
}

map $http_x_forwarded_proto $opr_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
